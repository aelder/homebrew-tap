name: formula

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Style
        run: brew style Casks/vh22-top.rb

      - name: Prepare local tap
        run: |
          brew tap-new aelder/tap
          mkdir -p "$(brew --repository aelder/tap)/Casks"
          cp Casks/vh22-top.rb "$(brew --repository aelder/tap)/Casks/"

      - name: Audit
        run: brew audit --strict --new --cask aelder/tap/vh22-top

      - name: Install cask from this checkout
        run: brew install --cask aelder/tap/vh22-top

      - name: Test
        run: |
          test "$(vh22-top --version)" = "vh22-top 1.1.2"
          installed="$(ruby -e 'puts File.realpath(ARGV[0])' "$(command -v vh22-top)")"
          test -f "$(dirname "$installed")/news.md"
